# XcodeGen fallback (only if Xcode refuses the hand-written AutreyMillSentry.xcodeproj):
#   curl -L -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
#   unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen && cp /tmp/xcodegen/xcodegen/bin/xcodegen ~/.local/bin/
#   ~/.local/bin/xcodegen generate
name: AutreyMillSentry
options:
  bundleIdPrefix: com.jeetusk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
targets:
  AutreyMillSentry:
    type: application
    platform: iOS
    sources:
      - path: AutreyMillSentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeetusk.autreymillsentry
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Mill Sentry"
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera is used to scan plants live. You can also choose a saved photo instead."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location, only while the app is open, pins reports on the preserve map so staff can find the plant. No background tracking."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  AutreyMillSentryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AutreyMillSentryTests]
    dependencies:
      - target: AutreyMillSentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeetusk.autreymillsentryTests
        GENERATE_INFOPLIST_FILE: YES
  AutreyMillSentryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AutreyMillSentryUITests]
    dependencies:
      - target: AutreyMillSentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeetusk.autreymillsentryUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AutreyMillSentry
schemes:
  AutreyMillSentry:
    build:
      targets:
        AutreyMillSentry: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [AutreyMillSentryTests, AutreyMillSentryUITests]
